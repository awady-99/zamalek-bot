name: Zamalek Ticket Monitor 24/7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 python-dotenv

      - name: Run Ticket Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          timeout 19800 python zamalek_ticket_bot.py || true

      - name: Re-trigger Workflow (Auto Loop)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.AUTO_RESTART_PAT }}
        run: |
          gh workflow run monitor.yml --repo awady-99/zamalek-bot
